[project]
name = "marketplace-rag"
version = "0.1.0"
description = ""
authors = [
    {name = "Egor Grushin",email = "egormix1703@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.165.0,<0.166.0)",
    "sqlalchemy[asyncio] (>=2.1.9,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)"
]

[tool.poetry]
packages = [{include = "marketplace_rag", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.6,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "radon (>=6.0.1,<7.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "xenon (>=0.9.3,<0.10.0)"
]

# ---------- Ruff ----------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "FAST",     # FastAPI
    "RUF",
]
ignore = [
    "B008",     # Depends() in defaults — стандартный паттерн FastAPI
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.ruff.format]
quote-style = "double"

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["marketplace_rag"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------- Bandit ----------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
